# One-click deploy on Render (Blueprint). Set ANTHROPIC_API_KEY in the dashboard after creation.
services:
  - type: web
    name: bookleaf-author-support
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: bookleaf-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
